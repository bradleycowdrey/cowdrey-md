name: Mac app

on:
  push:
    tags: ['v*']
    branches: [main]
    # Build a new DMG when the version number (or this workflow) changes on main.
    paths:
      - desktop/src-tauri/tauri.conf.json
      - desktop/src-tauri/Cargo.toml
      - .github/workflows/mac-app.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    name: Build Cowdrey.MD.dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install build tools and libraries
        working-directory: desktop
        run: npm ci

      - name: Bundle the web app for offline use
        working-directory: desktop
        run: node build.mjs

      # Builds a universal (Apple silicon + Intel) app and DMG, then attaches it to a GitHub Release.
      # To sign and notarize, add these repository secrets and the action picks them up:
      # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      # With the TAURI_SIGNING_PRIVATE_KEY secret set, the build also makes a signed update bundle and
      # latest.json, so installed copies can update themselves in place. Without it, only the DMG is built.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Cowdrey.MD v__VERSION__
          releaseBody: |
            Cowdrey.MD for Mac, a Markdown editor by Bradley Cowdrey (https://bradcowdrey.com).

            Download the .dmg below, open it, and drag Cowdrey.MD into Applications. It runs on Apple silicon and Intel Macs.

            This build is not yet signed by Apple. The first time you open it, macOS asks for confirmation: open System Settings, Privacy & Security, and click Open Anyway. Later versions install themselves from Help, Check for updates.
          releaseDraft: false
          prerelease: false
          args: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--target universal-apple-darwin --config src-tauri/tauri.updater.conf.json' || '--target universal-apple-darwin' }}

      # Without the signing secret, attach the plain app bundle so it can be signed elsewhere and
      # published through updates/latest.json (see publish-update.yml).
      - name: Attach the app bundle for in-place updates
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        if: env.HAS_KEY == 'false'
        run: |
          V=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          cd desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos
          COPYFILE_DISABLE=1 tar --no-mac-metadata -czf Cowdrey.MD_universal.app.tar.gz Cowdrey.MD.app
          gh release upload "v$V" Cowdrey.MD_universal.app.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
