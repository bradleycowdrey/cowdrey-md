[package]
name = "cowdrey-md"
version = "2.1.0"
description = "Cowdrey.MD, a Markdown editor by Bradley Cowdrey"
authors = ["Bradley Cowdrey"]
license = "MIT"
repository = "https://github.com/bradleycowdrey/cowdrey-md"
edition = "2021"

# The Mac app runs main.rs; the iPhone and iPad app loads the same code from this library.
[lib]
name = "cowdrey_md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# In-place updates and relaunching are for the Mac app only; the App Store updates the iPhone app.
# Android saves and opens files through the system picker's content:// addresses, read and written by this plugin.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-fs = "2"

# Native features on iPhone, iPad and Android (plugins/sharekit, adapted from tauri-plugin-sharekit 0.3.1): the share
# sheet, printing and PDF, files edited in place, and the sync folder. On the Mac, only its share menu is used.
[target.'cfg(any(target_os = "ios", target_os = "android", target_os = "macos"))'.dependencies]
tauri-plugin-sharekit = { path = "plugins/sharekit" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }

# The direct-download Mac app (DMG) updates itself: `updater` is on by default. The Mac App Store build
# (.github/workflows/mac-app-store.yml) is made with `--no-default-features --features app-store`: no
# self-updater (the App Store updates it), and security-scoped bookmarks so the sandboxed app can reopen
# recent files, save back to them and keep its sync folder after a restart.
[features]
default = ["updater"]
updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]
app-store = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
