[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--chrome); color: var(--ink); font-family: var(--font-ui); font-size: 13px; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--chrome); }
button, input, select, textarea { font: inherit; color: inherit; }
::placeholder { color: var(--ink-2); opacity: 1; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.CodeMirror [contenteditable]:focus, .CodeMirror [contenteditable]:focus-visible { outline: none; } /* the caret and active line already show focus */
svg.lucide { width: 16px; height: 16px; stroke-width: 1.8; flex: none; }
.gutter-x { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.app { height: 100%; display: flex; flex-direction: column; min-height: 0; }

/* ---------- title bar (Docs) ---------- */
.titlebar { flex: none; background: var(--chrome); }
.tb-inner { display: flex; align-items: center; gap: 12px; padding-block: 6px 0; }
.logo { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); text-decoration: none; }
.logo svg { width: 21px; height: 21px; }
.tb-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0; }
.tb-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.doc-title { font-size: 18px; font-weight: 600; letter-spacing: -.01em; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 2px 6px; margin-left: -7px; min-width: 60px; max-width: 100%; field-sizing: content; }
.doc-title:hover { border-color: var(--line); }
.doc-title:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.save-state { color: var(--ink-3); font-size: 12px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.save-state.error { color: var(--danger); }
.menubar { display: flex; gap: 0; margin-left: -8px; flex-wrap: wrap; }
.menubar > button { background: none; border: 0; padding: 3px 8px; border-radius: 5px; font-size: 13.5px; color: var(--ink); }
.menubar > button:hover, .menubar > button[aria-expanded="true"] { background: var(--hover); }
.tb-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 0; background: transparent; color: var(--ink-2); }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.primary-btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); padding: 9px 18px; font-weight: 600; font-size: 13.5px; }
.primary-btn:hover { filter: brightness(1.07); }

/* ---------- ribbon (Word) ---------- */
.ribbon { flex: none; background: var(--chrome); border-bottom: 1px solid var(--line); }
.ribbon-tabs { display: flex; align-items: flex-end; gap: 2px; padding-top: 4px; }
.ribbon-tabs button { position: relative; background: none; border: 0; padding: 7px 12px 8px; font-size: 13px; font-weight: 500; color: var(--ink-2); border-radius: 6px 6px 0 0; }
.ribbon-tabs button:hover { color: var(--ink); background: var(--hover); }
.ribbon-tabs button[aria-selected="true"] { color: var(--accent); }
.ribbon-tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
.ribbon-tabs .spacer { flex: 1; }
.ribbon-tabs .collapse { padding: 6px 8px; }
.ribbon-body { overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
.ribbon.collapsed .ribbon-body { display: none; }
.ribbon-body.overflow { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); scroll-snap-type: x proximity; }
.r-group { scroll-snap-align: start; }
.ribbon-panel { display: flex; align-items: stretch; gap: 0; padding-block: 6px 4px; width: max-content; min-width: 100%; box-sizing: border-box; }
.r-group { display: flex; flex-direction: column; padding: 0 10px; border-right: 1px solid var(--line); }
.r-group:first-child { padding-left: 0; }
.r-group:last-child { border-right: 0; }
.r-content { flex: 1; display: flex; align-items: center; gap: 4px; min-height: 56px; }
.r-label { text-align: center; font-size: 11px; color: var(--ink-3); padding-top: 3px; letter-spacing: .02em; white-space: nowrap; }
.r-rows { display: flex; flex-direction: column; gap: 3px; }
.r-row { display: flex; gap: 2px; align-items: center; }
.r-stack { display: flex; flex-direction: column; gap: 2px; }
.rb { display: inline-flex; align-items: center; gap: 6px; height: 28px; min-width: 28px; justify-content: center; padding: 0 6px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--ink); white-space: nowrap; font-size: 12.5px; }
.rb:hover { background: var(--hover); }
.rb:active { background: var(--press); }
.rb[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.rb.lbl { justify-content: flex-start; }
.rb.big { flex-direction: column; height: 56px; min-width: 58px; gap: 4px; padding: 6px 8px; font-size: 12px; }
.rb.big svg.lucide { width: 24px; height: 24px; stroke-width: 1.5; }
.rb .caret { width: 12px; height: 12px; opacity: .6; }
.sel { height: 28px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); padding: 0 6px; font-size: 12.5px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 4px 9px; font-size: 12px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg-label { font-size: 11px; color: var(--ink-3); min-width: 46px; }
/* Styles gallery (Word) */
.gallery { display: flex; gap: 4px; border: 1px solid var(--line); border-radius: 8px; padding: 4px; background: var(--surface); }
.g-card { width: 74px; height: 50px; border: 1px solid transparent; border-radius: 6px; background: transparent; display: flex; flex-direction: column; justify-content: space-between; padding: 6px 7px 5px; text-align: left; overflow: hidden; }
.g-card:hover { background: var(--hover); }
.g-card[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.g-card .s { color: var(--ink); line-height: 1.1; white-space: nowrap; }
.g-card .n { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
.g-card.page-style { width: 82px; }
.g-card.page-style .s { font-size: 15px; }

/* ---------- workspace ---------- */
.workspace { flex: 1; display: flex; min-height: 0; position: relative; background: var(--canvas); }
.sidebar { width: 248px; flex: none; display: flex; flex-direction: column; background: var(--chrome); border-right: 1px solid var(--line); min-height: 0; }
.app[data-outline="off"] .sidebar { display: none; }
.side-actions { display: flex; flex-direction: column; gap: 1px; padding: 10px 8px 6px max(8px, env(safe-area-inset-left, 0px)); }
.side-act { display: flex; align-items: center; gap: 10px; border: 0; background: none; border-radius: 7px; padding: 7px 8px; text-align: left; color: var(--ink); font-size: 13px; }
.side-act:hover { background: var(--hover); }
.side-act svg.lucide { color: var(--ink-2); }
.side-tabs { display: flex; gap: 2px; margin: 4px 8px 0 max(8px, env(safe-area-inset-left, 0px)); padding: 3px; background: var(--hover); border-radius: 8px; }
.side-tabs button { flex: 1; border: 0; background: transparent; border-radius: 6px; padding: 5px 0; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.side-tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.side-body { flex: 1; overflow: auto; padding: 8px 8px 16px max(8px, env(safe-area-inset-left, 0px)); min-height: 0; }
.side-heading { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 6px 8px 4px; }
.ol-item { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 5px 8px; border-radius: 6px; color: var(--ink-2); font-size: 13px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ol-item:hover { background: var(--hover); color: var(--ink); }
.ol-item.l1 { font-weight: 600; color: var(--ink); }
.ol-item.current { background: var(--accent-soft); color: var(--accent); }
.empty-note { color: var(--ink-3); font-size: 12.5px; padding: 8px; line-height: 1.5; }
.doc-item { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 8px; padding: 6px 6px 6px 8px; border-radius: 7px; cursor: pointer; }
.doc-item:hover { background: var(--hover); }
.doc-item.current { background: var(--accent-soft); }
.doc-item .t { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.doc-item .m { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.doc-item .del { opacity: 0; border: 0; background: none; color: var(--ink-3); border-radius: 5px; padding: 3px; display: grid; }
.doc-item:hover .del, .doc-item .del:focus-visible { opacity: 1; }
.doc-item .del:hover { color: var(--danger); background: var(--surface); }
.doc-item svg.lucide { color: var(--ink-3); }
.confirm-row { display: flex; gap: 6px; align-items: center; padding: 4px 8px 8px 34px; font-size: 12px; color: var(--ink-2); }
.mini-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 8px; font-size: 12px; }
.mini-btn.danger { background: var(--danger); color: #fff; border-color: transparent; }

.panes { flex: 1; display: flex; min-width: 0; min-height: 0; }
.pane { min-width: 0; min-height: 0; position: relative; display: flex; flex-direction: column; }
.editor-pane { flex: 0 0 50%; background: var(--ed-bg); }
.preview-pane { flex: 1 1 0; background: var(--canvas); }
.app[data-view="editor"] .preview-pane, .app[data-view="editor"] .divider { display: none; }
.app[data-view="editor"] .editor-pane { flex: 1 1 auto !important; }
.app[data-view="preview"] .editor-pane, .app[data-view="preview"] .divider { display: none; }
.divider { flex: none; width: 7px; margin: 0 -3px; z-index: 3; cursor: col-resize; position: relative; background: transparent; }
.divider::after { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 1px; background: var(--line); }
.divider:hover::after, .divider.drag::after { background: var(--accent); width: 2px; left: 2.5px; }

/* doc tabs (Markdot) */
.doc-tabs { display: flex; gap: 2px; align-items: flex-end; height: 32px; box-sizing: border-box; padding: 4px 8px 0; background: var(--ed-bg); border-bottom: 1px solid color-mix(in srgb, var(--ed-gutter) 30%, transparent); overflow-x: auto; scrollbar-width: none; flex: none; }
.doc-tab { display: inline-flex; align-items: center; gap: 2px; max-width: 260px; padding: 0 2px 0 0; border-radius: 7px 7px 0 0; color: var(--ed-dim); font-size: 12px; white-space: nowrap; }
.doc-tab .open { display: inline-flex; align-items: center; gap: 6px; min-width: 0; border: 0; background: none; color: inherit; padding: 5px 4px 6px 10px; border-radius: 7px 0 0 0; }
.doc-tab .open span { overflow: hidden; text-overflow: ellipsis; }
.doc-tab:hover { color: var(--ed-fg); }
.doc-tab.current { background: var(--ed-active); color: var(--ed-fg); font-weight: 600; }
.doc-tab .x { display: grid; place-items: center; width: 24px; height: 24px; border: 0; background: none; color: var(--ed-dim); border-radius: 5px; flex: none; }
.doc-tab .x:hover, .doc-tab .x:focus-visible { color: var(--ed-fg); background: color-mix(in srgb, var(--ed-gutter) 22%, transparent); }
.doc-tab .x svg.lucide { width: 12px; height: 12px; }
.doc-tabs .new-tab { border: 0; background: none; color: var(--ed-dim); padding: 4px 6px 6px; display: grid; }
.doc-tabs .new-tab:hover { color: var(--ed-fg); }

#editorHost { flex: 1; min-height: 0; position: relative; }
.CodeMirror.cm-s-cowdrey { height: 100%; background: var(--ed-bg); color: var(--ed-fg); font-family: var(--font-mono); font-size: var(--ed-size, 14.5px); line-height: 1.68; }
.cm-s-cowdrey .CodeMirror-lines { padding: 22px 0 40px; }
.cm-s-cowdrey pre.CodeMirror-line, .cm-s-cowdrey pre.CodeMirror-line-like { padding: 0 max(22px, env(safe-area-inset-left, 0px)) 0 22px; }
.app[data-view="editor"] .cm-s-cowdrey .CodeMirror-sizer { max-width: 820px; margin-left: auto !important; margin-right: auto; }
.cm-s-cowdrey .CodeMirror-gutters { background: var(--ed-bg); border-right: 0; }

# Welcome to Cowdrey.md

Hello! I'm **Cowdrey.md**, a Markdown editor made by Bradley Cowdrey at [bradcowdrey.com](https://bradcowdrey.com). You write plain text on the left, and I render a clean, printable page on the right as you type.

> [!TIP]
> This is a sample document. Edit anything here, it saves to this browser automatically. Start fresh with **New document** in the sidebar.

[TOC]

## The basics

Markdown is a plain-text syntax created by John Gruber in 2004. The ribbon above does the typing for you, but every format has a shortcut:

| Format | Type this | Shortcut |
| :--- | :--- | :---: |
| **Bold** | `**Bold**` | <kbd>⌘B</kbd> |
| *Italic* | `*Italic*` | <kbd>⌘I</kbd> |
| ~~Strike~~ | `~~Strike~~` | <kbd>⌘⇧X</kbd> |
| ==Highlight== | `==Highlight==` | Home ribbon |
| `Code` | `` `Code` `` | <kbd>⌘E</kbd> |
| H~2~O and E = mc^2^ | `H~2~O`, `mc^2^` | <kbd>⌘,</kbd> <kbd>⌘.</kbd> |

Lists continue themselves when you press Enter, and numbered lists count up for you.

1. Draft in the editor
2. Check the page preview
3. Export to Markdown, HTML, or paste straight into Docs or Word

### Task lists you can tick

- [x] Split view with synced scrolling
- [x] Outline, ruler, page breaks, and zoom
- [ ] Click a checkbox in the preview, the source updates too

## Callouts

> [!NOTE]
> Five GitHub-style callouts are built in: note, tip, important, warning, and caution.

> [!WARNING]
> Documents live in this browser only. Use **Export** to keep a copy somewhere safe.

## Code

```javascript
// Fenced code blocks get syntax highlighting and a copy button
function wordCount(text) {
  return text.trim().split(/\s+/).filter(Boolean).length;
}
```

## Math

Inline math such as $e^{i\pi} + 1 = 0$ sits inside a sentence. Display math gets its own line:

$$
\int_{-\infty}^{\infty} e^{-x^2}\,dx = \sqrt{\pi}
$$

## Diagrams

```mermaid
flowchart LR
  A[Write] --> B{Looks right?}
  B -- Yes --> C[Export]
  B -- Not yet --> A
```

## Everything else

Footnotes work[^1], and so do definition lists:

Typewriter mode
: Keeps the line you are writing in the middle of the screen.

Focus mode
: Dims every paragraph except the one you are working on.

Emoji shortcodes turn into the real thing :sparkles: :rocket:

<details>

Raw HTML is allowed, so collapsible sections work too.

</details>
