[package]
name = "cowdrey-md"
version = "1.0.0"
description = "Cowdrey.md, a Markdown editor by Bradley Cowdrey"
authors = ["Bradley Cowdrey"]
license = "MIT"
repository = "https://github.com/bc101101/cowdrey-md"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
