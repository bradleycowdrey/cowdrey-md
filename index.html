[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--chrome); color: var(--ink); font-family: var(--font-ui); font-size: 13px; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--chrome); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.CodeMirror [contenteditable]:focus, .CodeMirror [contenteditable]:focus-visible { outline: none; } /* the caret and active line already show focus */
svg.lucide { width: 16px; height: 16px; stroke-width: 1.8; flex: none; }
.gutter-x { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.app { height: 100%; display: flex; flex-direction: column; min-height: 0; }

/* ---------- title bar (Docs) ---------- */
.titlebar { background: var(--chrome); }
.tb-inner { display: flex; align-items: center; gap: 12px; padding-block: 8px 2px; }
.logo { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); text-decoration: none; }
.logo svg { width: 24px; height: 24px; }
.tb-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0; }
.tb-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.doc-title { font-size: 17px; font-weight: 500; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 2px 6px; margin-left: -7px; min-width: 60px; max-width: 100%; field-sizing: content; }
.doc-title:hover { border-color: var(--line); }
.doc-title:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.save-state { color: var(--ink-3); font-size: 12px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.save-state.error { color: var(--danger); }
.menubar { display: flex; gap: 0; margin-left: -8px; flex-wrap: wrap; }
.menubar > button { background: none; border: 0; padding: 3px 8px; border-radius: 5px; font-size: 13.5px; color: var(--ink); }
.menubar > button:hover, .menubar > button[aria-expanded="true"] { background: var(--hover); }
.tb-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 0; background: transparent; color: var(--ink-2); }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.primary-btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); padding: 9px 18px; font-weight: 600; font-size: 13.5px; }
.primary-btn:hover { filter: brightness(1.07); }

/* ---------- ribbon (Word) ---------- */
.ribbon { background: var(--chrome); border-bottom: 1px solid var(--line); }
.ribbon-tabs { display: flex; align-items: flex-end; gap: 2px; padding-top: 4px; }
.ribbon-tabs button { position: relative; background: none; border: 0; padding: 7px 12px 8px; font-size: 13px; font-weight: 500; color: var(--ink-2); border-radius: 6px 6px 0 0; }
.ribbon-tabs button:hover { color: var(--ink); background: var(--hover); }
.ribbon-tabs button[aria-selected="true"] { color: var(--accent); }
.ribbon-tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
.ribbon-tabs .spacer { flex: 1; }
.ribbon-tabs .collapse { padding: 6px 8px; }
.ribbon-body { overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
.ribbon.collapsed .ribbon-body { display: none; }

# Welcome to Cowdrey.md

Hello! I'm **Cowdrey.md**, a Markdown editor made by Bradley Cowdrey at [bradcowdrey.com](https://bradcowdrey.com). You write plain text on the left, and I render a clean, printable page on the right as you type.

> [!TIP]
> This is a sample document. Edit anything here, it saves to this browser automatically. Start fresh with **New document** in the sidebar.

[TOC]

## The basics

Markdown is a plain-text syntax created by John Gruber in 2004. The ribbon above does the typing for you, but every format has a shortcut:

| Format | Type this | Shortcut |
| :--- | :--- | :---: |
| **Bold** | `**Bold**` | <kbd>⌘B</kbd> |
| *Italic* | `*Italic*` | <kbd>⌘I</kbd> |
| ~~Strike~~ | `~~Strike~~` | <kbd>⌘⇧X</kbd> |
| ==Highlight== | `==Highlight==` | Home ribbon |
| `Code` | `` `Code` `` | <kbd>⌘E</kbd> |
| H~2~O and E = mc^2^ | `H~2~O`, `mc^2^` | <kbd>⌘,</kbd> <kbd>⌘.</kbd> |

Lists continue themselves when you press Enter, and numbered lists count up for you.

1. Draft in the editor
2. Check the page preview
3. Export to Markdown, HTML, or paste straight into Google Docs or Word

### Task lists you can tick

- [x] Split view with synced scrolling
- [x] Outline, ruler, page breaks, and zoom
- [ ] Click a checkbox in the preview, the source updates too

## Callouts

> [!NOTE]
> Five GitHub-style callouts are built in: note, tip, important, warning, and caution.

> [!WARNING]
> Documents live in this browser only. Use **Export** to keep a copy somewhere safe.

## Code

```javascript
// Fenced code blocks get syntax highlighting and a copy button
function wordCount(text) {
  return text.trim().split(/\s+/).filter(Boolean).length;
}
```

## Math

Inline math such as $e^{i\pi} + 1 = 0$ sits inside a sentence. Display math gets its own line:

$$
\int_{-\infty}^{\infty} e^{-x^2}\,dx = \sqrt{\pi}
$$

## Diagrams

```mermaid
flowchart LR
  A[Write] --> B{Looks right?}
  B -- Yes --> C[Export]
  B -- Not yet --> A
```

## Everything else

Footnotes work[^1], and so do definition lists:

Typewriter mode
: Keeps the line you are writing in the middle of the screen.

Focus mode
: Dims every paragraph except the one you are working on.

Emoji shortcodes turn into the real thing :sparkles: :rocket:

<details>
<summary>Click to expand</summary>

Raw HTML is allowed, so collapsible sections work too.

</details>

const PAGES = { letter: { w: 816, h: 1056, unit: 'in', label: 'Letter' }, a4: { w: 794, h: 1123, unit: 'cm', label: 'A4' }, wide: { w: 1040, h: 0, unit: 'in', label: 'Wide' }, fluid: { w: 0, h: 0, unit: 'in', label: 'Fluid' } };

    document.body.appendChild(ta); ta.select();

  const tip = `${c.label}${c.key ? ` (${fmtKey(c.key)})` : ''}`;

function currentStyle() {
  const l = cm.getLine(cm.getCursor().line) || '';
  const h = /^(#{1,6})\s/.exec(l); if (h) return 'h' + h[1].length;
  if (/^\s*>/.test(l)) return 'quote';
  const tok = cm.getTokenAt(cm.getCursor(), true);
  if (tok && tok.state && (tok.state.base?.fencedEndRE || tok.state.base?.localMode || tok.state.fencedEndRE)) return 'codeBlock';
  return 'normal';
}

  const g = $('#styleGallery'); if (!g) return;

  $$('.g-card', g).forEach((b) => b.setAttribute('aria-pressed', b.dataset.style === s));
}

preview.addEventListener('click', (e) => {
  const cb = e.target.closest('.task-check');
  if (cb) {
    const line = +cb.getAttribute('data-task-line');
    const text = cm.getLine(line);
    if (text != null) {
      const m = /^(\s*(?:[-*+]|\d+[.)])\s+\[)([ xX])(\])/.exec(text);
      if (m) cm.replaceRange(m[2] === ' ' ? 'x' : ' ', { line, ch: m[1].length }, { line, ch: m[1].length + 1 });
    }
    return;
  }
  const copy = e.target.closest('.copy-code');
  if (copy) { const code = copy.closest('.code-block').querySelector('code').textContent; copyText(code, 'Code copied'); return; }
  const link = e.target.closest('a[href]');
  if (link && !TAURI) {
    const href = link.getAttribute('href');
    if (!href.startsWith('#') && !/^(https?:|mailto:|tel:)/i.test(href)) { e.preventDefault(); toast('Links to other files open in the Mac app. Here, only web links and links within this page work.'); return; }
  }
  const a = e.target.closest('a[href^="#"]');
  if (a) {
    e.preventDefault();
    const id = decodeURIComponent(a.getAttribute('href').slice(1));
    const t = id && (preview.querySelector('#' + CSS.escape(id)) || preview.querySelector('#u-' + CSS.escape(id)) || preview.querySelector('#h-' + CSS.escape(id)));
    if (t) { canvas.scrollTop += t.getBoundingClientRect().top - canvas.getBoundingClientRect().top - 20; }
  }
});
preview.addEventListener('dblclick', (e) => {
  if (S.view === 'preview') return;

});

   ================================================================ */
const stripExt = (n) => n.replace(/\.(md|markdown|mdown|mkdn?|txt)$/i, '');
function openPathsAsDocs(files) {
  let last;
  for (const f of files) {
    const existing = docs.find((d) => d.path === f.path);
    if (existing) {
      last = existing;
      if (f.content !== existing.diskContent) {
        if (existing.content === existing.diskContent) {
          // no unsaved edits here, so take the newer copy from disk
          existing.content = existing.diskContent = f.content; existing.updated = Date.now();
          cmDocs.get(existing.id)?.setValue(f.content);
          markDirty(existing.id);
        } else {
          toast(`${f.name} changed on disk. Your unsaved version is kept; use Save as to keep both.`);
        }
      }
      continue;
    }
    last = makeDoc(f.content, stripExt(f.name), false);
    last.path = f.path; last.diskContent = f.content;
    docs.unshift(last); markDirty(last.id);
  }
  if (last) { persist(); openDoc(last.id); }
}
async function openNative() {
  try {
    let paths = await TAURI.dialog.open({ multiple: true, filters: [{ name: 'Markdown', extensions: ['md', 'markdown', 'mdown', 'mkd', 'mkdn', 'txt'] }] });
    if (!paths) return;
    if (!Array.isArray(paths)) paths = [paths];
    const files = [];
    for (const p of paths) files.push(await TAURI.core.invoke('read_text_file', { path: typeof p === 'string' ? p : p.path }));
    openPathsAsDocs(files);
  } catch (e) { toast(`Could not open: ${e}`); }
}
async function writeToPath(d, path, contents) {
  await TAURI.core.invoke('write_text_file', { path, contents });
  d.path = path; d.diskContent = contents; markDirty(d.id); persist();
  toast(`Saved ${baseName(path)}`);
}
async function saveToDisk(saveAs) {
  const d = cur();
  if (d.autoTitle) render();
  persist();
  const contents = cm.getValue();
  if (d.path && !saveAs) {
    try {
      let onDisk = null;
      try { onDisk = (await TAURI.core.invoke('read_text_file', { path: d.path })).content; } catch {}
      if (onDisk !== null && d.diskContent !== undefined && onDisk !== d.diskContent && onDisk !== contents) {
        openDialog({
          title: `${baseName(d.path)} changed on disk`,
          body: '<p>Another app changed this file after you opened it. Saving now replaces those changes with your version.</p>',
          actions: [{ label: 'Cancel' }, { label: 'Save as…', run: () => { setTimeout(() => saveToDisk(true), 0); } }, { label: 'Replace', danger: true, run: () => { writeToPath(d, d.path, contents).catch((e) => toast(`Could not save: ${e}`)); } }],
        });

      }
      await writeToPath(d, d.path, contents);

  }
  try {
    const path = await TAURI.dialog.save({ defaultPath: slugFile(d.title) + '.md', filters: [{ name: 'Markdown', extensions: ['md'] }] });

function dirName(p) { const i = p.lastIndexOf('/'); return i > 0 ? p.slice(0, i) : '/'; }

if (TAURI) {
  const takeOpened = () => TAURI.core.invoke('take_opened_files').then((files) => { if (files && files.length) openPathsAsDocs(files); }).catch(() => {});
  TAURI.event.listen('open-files', takeOpened);
  setTimeout(takeOpened, 0);
  TAURI.event.listen('flush-and-quit', () => {
    try { flushSave(); } finally { TAURI.core.invoke('quit_app').catch(() => {}); }
  });
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (/^(https?:|mailto:)/i.test(href)) { e.preventDefault(); TAURI.opener.openUrl(a.href).catch(() => {}); return; }
    if (href.startsWith('#') || !preview.contains(a)) return;
    e.preventDefault();
    const target = decodeURI(href.split('#')[0]);
    const d = cur();
    if (!/\.(md|markdown|mdown|mkdn?|txt)$/i.test(target)) { toast('Only links to Markdown files and web pages open from here.'); return; }
    if (!d.path && !target.startsWith('/')) { toast('Save this document first so links to nearby files can be found.'); return; }
    TAURI.core.invoke('read_text_file', { path: resolvePath(d.path || '/', target) }).then((f) => openPathsAsDocs([f])).catch((err) => toast(String(err)));
  }, true);
  C.saveMd.label = 'Export Markdown (.md)…';
  C.exportHtml.label = 'Export web page (.html)…';
  setSaveState = ((orig) => (kind) => { orig(kind); if (kind === 'saved') saveStateEl.querySelector('span').textContent = cur() && cur().path ? `Autosaved · ⌘S saves ${baseName(cur().path)}` : 'Autosaved · ⌘S saves to a file'; })(setSaveState);
}

/* ================================================================
   Boot
   ================================================================ */
buildMd();
app.dataset.outline = S.outline ? 'on' : 'off';
if (window.innerWidth <= 980 && S.outline) { S.outline = false; app.dataset.outline = 'off'; }
app.dataset.view = S.view;
renderRibbon();
applyTheme(); applyEditorPrefs(); applyPagePrefs();

})();
