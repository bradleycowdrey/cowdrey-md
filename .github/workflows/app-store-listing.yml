name: App Store listing

on:
  push:
    branches: [main]
    # Update the listing when its text, screenshots or this workflow change.
    paths:
      - docs/app-store/**
      - .github/scripts/app_store_listing.py
      - .github/workflows/app-store-listing.yml
  # After each iPhone build uploads, attach it to the App Store version once Apple has processed it.
  workflow_run:
    workflows: ['iPhone app']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  listing:
    name: Fill in the App Store listing (does not submit)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Update App Store Connect
        env:
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -o pipefail
          pip install --quiet pyjwt cryptography
          # After an iPhone build only the build is attached; the full listing is filled in when docs/app-store changes.
          MODE=$([[ "${{ github.event_name }}" == workflow_run ]] && echo --build-only || true)
          python3 .github/scripts/app_store_listing.py $MODE 2>&1 | tee "$RUNNER_TEMP/listing.log"

      # The result goes on the app-store-log branch, so it can be read without signing in to GitHub.
      - name: Publish the result
        if: always()
        env:
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          [[ -f "$RUNNER_TEMP/listing.log" ]] || exit 0
          LOG=$(cat "$RUNNER_TEMP/listing.log")
          for S in "$APPLE_API_ISSUER" "$APPLE_API_KEY"; do if [[ -n "$S" ]]; then LOG=${LOG//"$S"/***}; fi; done
          cd "$(mktemp -d)" && git init -q -b app-store-log && printf '%s\n' "$LOG" > listing.log
          echo "${{ job.status }} · run ${{ github.run_number }} · ${{ github.sha }}" > status.txt
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "App Store listing log, run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" app-store-log
