name: Publish update

# updates/latest.json describes a signed in-place update. When it changes on main, attach it to the
# matching release so installed copies (which read releases/latest/download/latest.json) find it.
on:
  push:
    branches: [main]
    paths: [updates/latest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach latest.json to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(jq -r .version updates/latest.json)
          gh release upload "v$V" updates/latest.json --clobber --repo "$GITHUB_REPOSITORY"
