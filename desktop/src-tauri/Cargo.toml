[package]
name = "cowdrey-md"
version = "1.0.3"
description = "Cowdrey.MD, a Markdown editor by Bradley Cowdrey"
authors = ["Bradley Cowdrey"]
license = "MIT"
repository = "https://github.com/bradleycowdrey/cowdrey-md"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
