name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04 # Playwright 1.56 supports this Ubuntu; ubuntu-latest moved to 26.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install the app's libraries (served to the browser offline)
        working-directory: desktop
        run: npm ci

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Check index.html is built from src/
        run: |
          python3 build.py
          git diff --exit-code index.html artifact.html

      - name: Run the tests
        run: |
          set -o pipefail
          node tests/e2e.mjs 2>&1 | tee "$RUNNER_TEMP/tests.log"

      # The App Store screenshots: the raw captures framed in the family standard, checked against it, and kept as
      # an artifact to review. Nothing is uploaded to App Store Connect from here.
      - name: Frame the App Store screenshots
        run: node scripts/store-frames/store-frames.js --config scripts/store-frames/cowdrey-md.json --out "$RUNNER_TEMP/store-frames"

      - uses: actions/upload-artifact@v4
        with:
          name: app-store-frames
          path: ${{ runner.temp }}/store-frames

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-log
          path: ${{ runner.temp }}/tests.log
          if-no-files-found: ignore

  mac-app-code:
    name: Mac app compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - name: Bundle the web app
        working-directory: desktop
        run: npm ci && node build.mjs

      - name: Check the Rust code
        working-directory: desktop/src-tauri
        run: cargo check --locked || cargo check

  # The result goes on the tests-log branch, so it can be read without signing in to GitHub.
  log:
    name: Publish the result
    needs: [e2e, mac-app-code]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tests-log
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tests-log
          path: ${{ runner.temp }}/in

      - run: |
          cd "$(mktemp -d)" && git init -q -b tests-log
          if [[ -f "$RUNNER_TEMP/in/tests.log" ]]; then tail -c 200000 "$RUNNER_TEMP/in/tests.log" > tests.log; else echo "(no log)" > tests.log; fi
          printf 'End-to-end tests: %s\nMac app compiles: %s\n' "${{ needs.e2e.result }}" "${{ needs.mac-app-code.result }}" > results.txt
          echo "e2e ${{ needs.e2e.result }}, mac-app-code ${{ needs.mac-app-code.result }} · run ${{ github.run_number }} · ${{ github.sha }}" > status.txt
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Tests log, run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tests-log
