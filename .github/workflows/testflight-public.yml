name: TestFlight public link

# Keeps a public TestFlight link so anyone can install the iPhone and iPad app before it is on the App Store.
# After each iPhone build, the new build joins the "Public" tester group and goes to beta review if needed.
on:
  push:
    branches: [main]
    paths:
      - .github/scripts/testflight_public.py
      - .github/workflows/testflight-public.yml
  workflow_run:
    workflows: ['iPhone app']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-link:
    name: Add the newest build to the public TestFlight group
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Update TestFlight
        env:
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -o pipefail
          pip install --quiet pyjwt cryptography
          python3 .github/scripts/testflight_public.py 2>&1 | tee "$RUNNER_TEMP/testflight.log"

      # The result goes on the testflight-log branch, so it can be read without signing in to GitHub.
      - name: Publish the result
        if: always()
        env:
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          [[ -f "$RUNNER_TEMP/testflight.log" ]] || exit 0
          LOG=$(cat "$RUNNER_TEMP/testflight.log")
          for S in "$APPLE_API_ISSUER" "$APPLE_API_KEY"; do if [[ -n "$S" ]]; then LOG=${LOG//"$S"/***}; fi; done
          cd "$(mktemp -d)" && git init -q -b testflight-log && printf '%s\n' "$LOG" > testflight.log
          echo "${{ job.status }} · run ${{ github.run_number }} · ${{ github.sha }}" > status.txt
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "TestFlight public link log, run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" testflight-log
